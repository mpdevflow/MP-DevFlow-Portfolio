<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MPDevFlow social share artwork</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Manrope:wght@400;600;700&family=Source+Serif+4:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --canvas: #f5f2eb;
        --surface: #fffdfa;
        --ink: #1c1d19;
        --secondary: #595a52;
        --accent: #b94727;
        --hairline: #d8d4ca;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: Manrope, Arial, sans-serif;
      }
      .artwork {
        width: 1200px;
        height: 630px;
        padding: 32px;
      }
      .sheet {
        height: 100%;
        background: var(--surface);
        border-radius: 8px;
        padding: 40px;
        position: relative;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--hairline);
      }
      .brand {
        display: flex;
        gap: 16px;
        align-items: center;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -2px;
      }
      .brand img {
        width: 64px;
        height: 64px;
      }
      .label {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
        line-height: 1.8;
        color: var(--secondary);
      }
      .label.top {
        text-align: right;
      }
      h1 {
        margin: 32px 0 0;
        font-size: 72px;
        letter-spacing: -3px;
        font-weight: 700;
        line-height: 1.08;
      }
      h1 em {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 80px;
        font-weight: 400;
        font-style: normal;
      }
      .dot {
        color: var(--accent);
      }
      .description {
        margin-top: 24px;
        font-size: 20px;
        line-height: 1.5;
        color: var(--secondary);
      }
      footer {
        position: absolute;
        left: 40px;
        right: 40px;
        bottom: 32px;
        padding-top: 24px;
        border-top: 1px solid var(--hairline);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .domain {
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="artwork">
      <div class="sheet">
        <header>
          <div class="brand">
            <img src="../public/assets/mpdevflow-mark.svg" alt="" /><span>MPDevFlow</span>
          </div>
          <div class="label top">Senior-led product studio<br />Philippines</div>
        </header>
        <h1>
          From rough idea<br /><em>to working product<span class="dot">.</span></em>
        </h1>
        <p class="description">
          Websites, MVPs and useful tools. Thoughtfully built, clearly delivered.
        </p>
        <footer>
          <span class="domain">mpdevflow.com</span
          ><span class="label">Independent thinking. Working products.</span>
        </footer>
      </div>
    </div>
  </body>
</html>
